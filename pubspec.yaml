name: starterkit_mrh
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  go_router: ^17.5.0
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  toastification: ^3.2.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1
  safe_device: ^1.4.1
  logger: ^2.7.0
  url_launcher: ^6.3.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
  - env/
  - assets/
  - assets/images/
  - assets/icons/
  - assets/fonts/

  # fonts:
  #   - family: Schyler
